schema_version: "1.1"
name: mixed-sources-topic-map
expected_outcome: |
  Asks or states what the learner wants to be able to do, splits the subject into a few separate topics with one notebook each, plans sources of mixed types (web page, YouTube, local PDF, and a copy of the book from an existing notebook) without requiring Calibre, proposes a learning loop and a costed pack per topic, and stops for approval without creating anything.
